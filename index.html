<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Essensplan</title>
  <meta name="description" content="Essenspläne erstellen, Gerichte sammeln und Zutaten berechnen.">
  <meta name="theme-color" content="#2f6b4f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Essensplan">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top"><h1 id="title">Essensplan</h1></header>
  <main id="main"></main>

  <nav class="tabs" aria-label="Hauptmenü">
    <button data-a="tab" data-tab="plan">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      Plan
    </button>
    <button data-a="tab" data-tab="dishes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2z"/><path d="M5 18a2 2 0 0 1 2-2h12M9 8h6"/></svg>
      Gerichte
    </button>
    <!-- Einkauf ist für die erste Version ausgeblendet. Der Code in app.js bleibt erhalten.
    <button data-a="tab" data-tab="shop">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.5 12h10.5l2-8H6"/><circle cx="9" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>
      Einkauf
    </button>
    -->
    <button data-a="tab" data-tab="more">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      Mehr
    </button>
  </nav>

  <dialog id="sheet"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <input id="photoFile" type="file" accept="image/*" hidden>
  <datalist id="units">
    <option value="g"><option value="kg"><option value="ml"><option value="l">
    <option value="EL"><option value="TL"><option value="Stück"><option value="Dose">
    <option value="Bund"><option value="Prise"><option value="Packung"><option value="Zehe">
  </datalist>

  <script src="js/vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/planner.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
